      收入机关: 3
      填发日期: 2
      缴款单位: 3
      报关单编号: 3
      完税价格: 3
    qr:
      fields: {}
    tables:
      tax_items:
        headers: [税号, 货物名称, 数量, 单位, 完税价格(¥), 税率(%), 税款金额(¥)]
        aliases:
          完税价格(¥): [完税价格, 完税价格（¥）]
          税率(%): [税率, 税率（%）]
          税款金额(¥): [税款金额, 税款金额（¥）]
        min_columns: 5
        header_row_slack: 6
        row_required: [货物名称, 税款金额(¥)]
        stop_labels: [金额人民币, 合计, 申请单位编号, 合同, 缴款期限, 备注]
        # 完税价格与税率之间没有竖线时 OCR 会并成一个框（6,679,515.0813.0000）；
        # 两侧必须分别完整匹配下面的模式才拆，且拆分点靠近表头列边界。
        column_patterns:
          完税价格(¥): '^\d[\d,]*\.\d{2}$'
          税率(%): '^\d{1,2}(?:\.\d{1,4})?$'
