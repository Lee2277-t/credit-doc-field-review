      - {path: cv.payment_number, label: 号码, type: string, required: true, risk: identity, extractor: label_region, value_strip_prefix: [No., NO., no.], rules: [PAYMENT_NO]}
      - {path: cv.issue_date, label: 填发日期, type: date, required: true, risk: date, extractor: label_value, rules: [DATE]}
      - {path: cv.payer_name, label: 名称, type: string, required: true, risk: party_name, extractor: label_region, occurrence: 1, rules: [NON_EMPTY]}
      - {path: cv.payer_tax_id, label: 帐号, aliases: [账号], type: string, required: true, risk: identity, extractor: label_region, rules: [TAX_ID]}
      - {path: cv.bank_name, label: 开户银行, type: string, required: false, risk: optional_low_risk, extractor: label_region, max_value_parts: 2, rules: []}
      - {path: cv.revenue_authority, label: 收入机关, type: string, required: true, risk: free_text, extractor: label_region, rules: [NON_EMPTY]}
      - {path: cv.subject, label: 科目, type: string, required: true, risk: free_text, extractor: label_region, rules: [NON_EMPTY]}
      - {path: cv.budget_level, label: 预算级次, type: string, required: false, risk: optional_low_risk, extractor: label_region, rules: []}
      - {path: cv.collection_treasury, label: 收款国库, type: string, required: false, risk: optional_low_risk, extractor: label_region, max_value_parts: 2, rules: []}
      - {path: cv.total_amount, label: 合计, aliases: [合计(￥)], type: decimal, required: true, risk: monetary, extractor: label_region, value_strip_prefix: [Y, ￥, ¥], rules: [MONEY]}
      - {path: cv.total_amount_cn, label: 金额人民币（大写）, type: string, required: false, risk: free_text, extractor: label_region, rules: []}
      - {path: cv.declaration_number, label: 报关单编号, type: string, required: true, risk: identity, extractor: label_region, rules: [DECLARATION_NO]}
      - {path: cv.application_number, label: 申请单位编号, type: string, required: false, risk: identity, extractor: label_region, rules: [APPLICATION_NO]}
      - {path: cv.contract_number, label: 合同(批文)号, aliases: [合同（批文）号], type: string, required: false, risk: optional_low_risk, extractor: label_region, rules: []}
      - {path: cv.transport_name, label: 运输工具（号）, aliases: [运输工具(号)], type: string, required: false, risk: optional_low_risk, extractor: label_region, max_value_parts: 2, preserve_spaces: true, rules: []}
      - {path: cv.bill_of_lading_number, label: 提/装货单号, aliases: [提装货单号], type: string, required: false, risk: identity, extractor: label_region, rules: [BILL_NO]}
      - {path: cv.payment_deadline, label: 缴款期限, type: date, required: false, risk: date, extractor: label_region, rules: [DATE_OPT]}
      - {path: cv.transaction_number, label: 交易流水号, type: string, required: false, risk: identity, extractor: label_region, rules: [PAYMENT_NO]}
      - {path: "cv.items[i].hs_code", label: 税号, type: string, required: false, risk: identity, extractor: table_cell, table: tax_items, column: 税号, array: cv.items, strip_pattern: '^\d{1,3}[.、]\s*', rules: [HS_CODE]}
      - {path: "cv.items[i].name", label: 货物名称, type: string, required: true, risk: free_text, extractor: table_cell, table: tax_items, column: 货物名称, array: cv.items, rules: [NON_EMPTY]}
      - {path: "cv.items[i].quantity", label: 数量, type: decimal, required: true, risk: count, extractor: table_cell, table: tax_items, column: 数量, array: cv.items, rules: [POSITIVE]}
      - {path: "cv.items[i].unit", label: 单位, type: string, required: false, risk: optional_low_risk, extractor: table_cell, table: tax_items, column: 单位, array: cv.items, rules: []}
      - {path: "cv.items[i].dutiable_value", label: 完税价格(¥), type: decimal, required: true, risk: monetary, extractor: table_cell, table: tax_items, column: 完税价格(¥), array: cv.items, rules: [MONEY]}
      - {path: "cv.items[i].tax_rate", label: 税率(%), type: string, required: true, risk: enum_flag, extractor: table_cell, table: tax_items, column: 税率(%), array: cv.items, rules: []}
      - {path: "cv.items[i].tax_amount", label: 税款金额(¥), type: decimal, required: true, risk: monetary, extractor: table_cell, table: tax_items, column: 税款金额(¥), array: cv.items, rules: [MONEY]}

enums:
  currency:
    CNY: [人民币, 人民币元, CNY, RMB, 元]
  direction:
    income: [收入, 收, 贷, 贷方, 入账]
    expense: [支出, 付, 借, 借方, 出账]
  flag:
    "yes": [是, 有, 存在, 正常, Y, YES]
    "no": [否, 无, 不存在, N, NO]
    unknown: [未知, 不详, -]
  unit:
    CNY_YUAN: [元, 人民币元, CNY]
    CNY_WAN_YUAN: [万元, 万, 人民币万元]
    # 年报合并报表常用「人民币百万元」，抽取时按 1,000,000 折算成元。
    CNY_MILLION: [百万元, 人民币百万元]
  rating:
    AAA: [AAA]
    AA: [AA, AA+]
    A: [A, A+]

hard_abstain_reasons:
  - GROUNDING_MISSING
  - LOW_OCR
  - FORMAT_FAIL
  - ENUM_UNKNOWN
  - CROSS_FIELD_FAIL
  - EXTRACTOR_CONFLICT
  - AMBIGUOUS_UNIT
  - AMBIGUOUS_DATE
  - UNKNOWN_DOC_TYPE
  - PARSE_LOW_QUALITY
  - NON_CNY_CURRENCY
  - REQUIRED_EMPTY
  - TEMPLATE_MISMATCH
  - CHAIN_UNRELIABLE
  # 金额符号由借贷方向推断，原图没有负号，必须人工确认。
  - SIGN_INFERRED
  # 印章压住了取值所在的那块区域，字迹被遮挡，不能自动接受。
  - SEAL_OVERLAP
  # 表格出现疑似合并单元格/列错位片段，受影响行必须人工确认。
  - TABLE_ANOMALY
  # 票面二维码与 OCR 读数冲突：两个来源都是原文，但说法不一致，必须人工裁决。
  - QR_CONFLICT
  # 页面有效分辨率不足：放大后的糊字可能被 OCR 高置信度读错。
  - LOW_RESOLUTION
  # 年报版式没有表头与框线，按行回落取到的值先交人工确认。
  - LINE_FALLBACK
  # 征信报告的重表头矩阵没有逐格框线，取到的值先交人工确认。
  - MATRIX_FALLBACK
  # OCR 整页漏字，靠标签右侧裁切补读出来的值，识别路径不同于整页 OCR。
  - LOCAL_RECROP
  # 声称读到的原文在页面上找不到（逐字回查未命中）：编造信号，必须人工确认。
  - RAW_UNVERIFIED
  # 纸上印的是占位符，已被折成空值：这个「空」是机器翻译出来的，语义要人确认。
  - PLACEHOLDER_EMPTY

# 表格结构独立度量（G4 / P1-6，对标 docTR 的 TableCellMetric 与 PaddleOCR PP-Structure 的 structure_score）。
# 全是诊断口径：这里没有一个数字参与信任决策，改它不会让任何字段被放行或被拦下。
evaluation:
  # SCENARIO §10.1 的三条匹配规则，评估口径只改这里，代码里不留第二份。
  # 值正确：按 4.2 归一化后「完全相等」——归一化会把金额四舍五入到分，所以 "100.00" 与
  # "100" 同值，但旧的 ±0.01 容差还会把差一分的 100.01 当成 100.00；容差默认 0，放宽要显式写。
  # 溯源正确：预测 bbox 中心点在标注 bbox 内，或与标注 bbox 的 IoU ≥ min_iou；
  # 旧的「任何正重叠就算命中」口径已作废（大框、歪框会被误记成溯源正确）。
  # 交易行内容键：§10.1 原文只列这三个，direction 不进内容键（它走字段级判等）。
  match:
    decimal_tolerance: 0.0
    min_iou: 0.5
    center_inside: true
    transaction_keys: [txn_date, amount, balance]
  table_structure:
    # 标注格与检出格的配对门槛用的是「嵌套度」= 交集面积 / 任一格面积（取较大者），不是 IoU。
    # 理由实测过：pdfplumber 交整列带、segment_table 交贴着字的框，按 IoU≥0.5 配会在 dev 上
    # 少配 455/1344 格，把「格子找到了、只是框更紧」误判成漏检。
    cover_threshold: 0.5
    # 框的贴合度另外报（不进结构判定）：超过这个 IoU 算「框贴得准」，按引擎分开看。
    strict_iou: 0.9
    # 每份文档最多留多少条结构错示例，防止诊断 JSON 被上百格明细撑大。
    max_examples: 20
  # SCENARIO §9.3：每次评估记录代码版本、配置哈希、样本清单哈希（evaluate 写进报告）。
  # SCENARIO §9.4：合成集的局限必须写进评估报告；正式上线前至少 20 份真实脱敏样本重校准。
  provenance:
    # 真实脱敏样本不足这个数时，报告结论的范围只能是 synthetic_only——合成集只能证明
    # 坐标/决策/复核闭环/评估方法成立，不许据此宣称真实业务准确率。
    min_real_samples: 20
    # 逐字写进每一次评估报告的限制说明。改口径改这里，不在代码里留第二份文案。
    limitations:
      - 合成模板不含真实扫描件的印章、装订孔、手写批注、复杂表格线与银行模板差异。
      - 合成集指标只能证明坐标、决策、复核闭环与评估方法成立，不能证明真实业务准确率。
      - 正式上线前必须用至少 20 份真实脱敏样本重新校准与评估，阈值与校准器按真实分布重拟合。
  # SCENARIO §9.1 的语料形状是全部指标的共同分母（每 split 10 份、3/3/2/2、
  # 5 文本 + 5 扫描、每类至少 1 份扫描、流水 45~60 笔 3~4 页、每 split ≥120 笔）。
  # 只由 docpipe.corpusaudit 读取（验收 corpus.*），判决链路不读这些数：它们描述
  # 样本集应当长什么样，不描述单份文档该怎么判。
  corpus:
    documents_per_split: 10
    per_doc_type:
      BUSINESS_LICENSE: 3
      BANK_STATEMENT: 3
      INCOME_STATEMENT: 2
      CREDIT_REPORT_ENTERPRISE: 2
    formats:
      text: 5
      scan: 5
    min_scans_per_doc_type: 1
    statement_rows: {min: 45, max: 60}
    statement_pages: {min: 3, max: 4}
    min_transactions_per_split: 120
  # 新增一类文档「要动几处」的接入契约，由 docpipe.doctypeaudit 逐类型审计（验收
  # doctype.*）。这里只放两个可调的数：schema 的最低下限，以及哪些类型承诺了合成样本。
  doc_type_contract:
    # 每个类型至少这么多必填字段。低于它的 schema 还是草稿：检测权重与表格模板配得再齐，
    # 也抽不出一个可交付的核心字段。出厂 6 个类型里最少的营业执照有 6 个必填。
    min_required_fields: 3
    # 必须同时有合成构建器（synth.SYNTH_BUILDERS）与至少 1 份清单样本的类型。
    # 发票与缴款书目前只有 schema、抽取与单测夹具，没有合成版面，如实不列；
    # 列进来就等于承诺「docpipe.synth 跑得出、samples/manifest.json 找得到」。
    require_synth: [BUSINESS_LICENSE, BANK_STATEMENT, INCOME_STATEMENT,
                    CREDIT_REPORT_ENTERPRISE]

  # SCENARIO §12.1「统一解析输出」的契约审计，由 docpipe.parseaudit 读（验收
  # parse_contract.*）。前三个数是覆盖下限：0 违规不许其实是 0 文件。bbox 容差是
  # 「框算不算越出页/表」的唯一松紧带——文档里的坐标是浮点，判定要留一点余量。
  parse_contract:
    min_documents: 5
    min_pages: 20
    min_lines: 100
    bbox_tolerance: 1.0
  # SCENARIO §6.3 风险档阈值契约：八档阈值、`包含字段` 一列与全局下限都由
  # docpipe.riskcontract 拿来与 thresholds / 字段 schema 逐条对账（验收 thresholds.*）。
  # 这里只有一个覆盖下限：0 违规不许其实是 0 行表。
  threshold_contract:
    min_tiers: 8
  # SCENARIO §1.3 成功定义 / §10.3 阶段门槛：五个验收门槛与文档逐值对账（验收 gates.*）。
  # 这里只有一个覆盖下限：0 违规不许其实是 0 行表。
  gate_contract:
    min_stages: 5

# 验收门槛，供 python -m docpipe.acceptance 读取。
acceptance:
  min_auto_accept_rate: 0.60
  max_accepted_error_rate: 0.02
  max_monetary_accepted_error_rate: 0.01
  max_accepted_grounding_missing: 0
  min_grounding_hit_rate: 0.98
  min_transaction_content_match_rate: 0.98
  # SCENARIO §6.5 的小样本规矩：已接受字段不足这么多时，指标只是「暂定结论」，
  # 必须连同置信区间一起看，不许宣称达标。这个数以前硬编码在 acceptance 的代码里。
  # 判决按每个指标自己的分母算（金额错值率看金额类已接受格数，不看总格数）；分组里没有金额
  # 字段时这一维记 not_applicable，不拖累判决。没过线就是没过线——样本小只豁免「宣称达标」，
  # 不豁免失败。
  min_accept_for_claim: 100
  # 区间的置信水平，Wilson 的 z 由它换算（不再另写死 1.96）。
  claim_confidence: 0.95
  require_review_flow: true
  require_image_ingest: true
  require_ingest_flow: true
  # 验收脚本对本机接口的等待上限（秒）。/api/import/run 会当场跑完整流水线（冷启动实测约 7.5 秒），
  # 前面几项检查还会占 CPU；写死 10 秒时这一项会偶发 TimeoutError，所以做成可配。
  http_timeout_seconds: 30
  # 拍照资料的矫正/压章/判废验收：造一张歪的、一张盖章的、一张糊的照片走完整链路。
  require_photo_preprocess: true
  photo_skew_degrees: 7          # 夹具故意拍歪的角度，矫正结果允许 ±1.5°
  photo_deskew_tolerance: 1.5
  photo_blur_radius: 6           # 高斯模糊半径，大到肉眼读不了、小到人还能看出是文件
  photo_expected_flags: [PHOTO_BLUR]
  # 反光带内的字段数至少要达到「同样光照但没有反光」那张的这么多，才算压制真的救回了内容。
  photo_glare_field_share: 0.8
  # 影调改写夹具：整页压暗到「提亮门 + 对比度门都不过」，用来验收旗标一路走到复核台和报表。
  # 这两个数只是怎么把页面弄暗，判定门限仍然在 preprocess.enhance 里。
  photo_dark_scale: 0.40
  photo_dark_offset: 20
  # 表格异常：夹具里同时放一条跨列片段（列错位）与一个越过相邻列中心的框（横向并框），必须从解析一路带到复核理由。
  require_table_anomaly: true
  # 页级分辨率门：把样本按下面的 dpi 栅格化，整页字段必须因为 LOW_RESOLUTION 进复核，
  # 同一份按 300dpi 栅格化时必须一个字段都不受这条影响。
  require_page_quality_gate: true
  page_quality_fixture_dpi: 100
  # 征信概要矩阵：标签缺失时按「区段标题 + 重复列头 + 行标签」定位取数，
  # 金额单位必须来自报告正文（万元），位置对不上就整行弃权并交复核。
  require_credit_matrix: true
  # OCR 后端必须由 `parsing.ocr_engine` 决定：换成 `null` 时这一页必须真的没有 OCR 证据，
  # 写没注册的名字必须报错（悄悄退回默认引擎会让指标看着正常、实际读的是别的东西）。
  require_ocr_engine: true
  # OCR 漏掉孤立单字时，标签右侧裁切补读必须能把真实扫描件里的值补回来，
  # 且补出来的值不能被自动接受。
  require_ocr_recrop: true
  # 硬性复核原因码必须在复核台有中文文案：新增原因却忘了界面标签，
  # 人看到的就是裸代码（P0-8 的 MATRIX_FALLBACK 就是这么漏掉的）。
  require_reason_ui_labels: true
  # EXTRACTOR_CONFLICT 是 SCENARIO 里的硬性原因，配置写的备选通路必须有实现：
  # 干净样张要能拿到第二通路证词且不报冲突，把单元格换成邻列的数必须进复核。
  require_extractor_crosscheck: true
  # 编造率回查不能是装饰：干净样张要零命中，把原文换成页面上没有的串要报出来，
  # 开关打开后必须进复核。默认只做指标、不改判决（标注集实测零误报前不开）。
  require_raw_text_audit: true
  # 拒绝契约：每个硬性原因都要有一句「该去核对什么」，并且这句话真的出现在复核台、
  # out/fields.csv 与 final/final_fields.csv 三个出口上（P1-7）。
  require_review_contract: true
  # 值改写披露：单位折算（万元→×10,000）与正负号（按收支方向列印的字判的）都是抽取
  # 做过的改写。这句话要由 meta 现算，并真的出现在 payload、out/fields.csv、复核台与
  # 单文件网页版四个出口上；只写「系统换算过」不算数，必须点名纸面上的依据（P1-4f）。
  require_value_rewrite_disclosure: true
  # 流水链判决要说清依据：CHAIN_UNRELIABLE 过去只有一个码，人不知道是 6 行里错 5 行
  # 还是末行对不上期末。这句话由链诊断现算（四种触发各有一句），健康流水一个字不出，
  # 并要真的出现在复核台、out/fields.csv、final/final_fields.csv 与单文件网页版四个出口。
  require_chain_disclosure: true
  # 样本清单冻结（SCENARIO 第 109 行）：清单里的 sha256 必须与磁盘一致；内容变了必须升
  # manifest 的 version 并重登记基线（`python -m docpipe.samplefreeze --write`）。
  require_sample_freeze: true
  # 复核修正要能变回校准样本：accept/correct 的判决方向、最后一次判定优先、
  # 样本不足整批不接、开关关着时一个目录都不扫（P1-8）。
  require_review_loop: true
  # 表格结构独立度量（P1-6 / G4）：标注格与检出格配对后必须能算出这份分片的结构分，
  # 干净分片要零错格；结构分只做诊断，不参与任何字段的自动接受。
  # 阈值在 evaluation.table_structure 里，不在这里。
  require_table_structure: true

# SCENARIO §5.4 跨文档一致性表：逐条照抄契约里的「失败处理」用词与参与比对的字段路径。
# `enforced` 是代码今天真会发出的判决；false 表示这一条由别的规则承担、或契约本身就声明不做，
# 写在这里是为了让「表里有、代码没有」变成看得见的数据，而不是沉默的事实。
cross_document:
  rules:
    V-X-01:
      severity: warn
      review: true
      enforced: true
      paths: [bl.company_name, bs.account_name, is.company_name, cr.company_name]
    V-X-02:
      severity: fail
      review: true
      enforced: true
      paths: [bl.unified_social_credit_code, cr.unified_social_credit_code]
    V-X-03:
      # 账号全文一致由 V-BS-05 承担，户名与执照名称一致由 V-X-01 承担。
      # 契约只写「fail（账号）/ warn（户名）」，没写「复核」——fail 由通用规则强制复核，
      # warn 不加码，配置里 claimed 复核就是造假。
      severity: fail
      review: false
      enforced: false
      paths: [bs.account_number]
    V-X-04:
      # 利润表期末 vs 征信查询日：归组口径与 V-X-01 相同（名称归一化后相同＝同一主体），
      # 配不上对不判。契约这一格只有「warn」，没有复核义务。
      severity: warn
      review: false
      enforced: true
      paths: [is.statement_period_end, cr.query_date]
    V-X-05:
      # 契约本身声明「不做金额强校验」，这里只登记「不参与决策」。
      severity: none
      review: false
      enforced: false
      paths: []
