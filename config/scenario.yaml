        headers: [项目, 本期金额, 上期金额]
        aliases: {}
        min_columns: 2
        row_labels: [营业收入, 营业成本, 税金及附加, 销售费用, 管理费用, 研发费用, 财务费用,
                     其他收益, 投资收益, 信用减值损失, 资产减值损失, 资产处置收益,
                     公允价值变动收益, 营业利润, 营业外收入, 营业外支出, 利润总额,
                     所得税费用, 净利润, 综合收益总额]
        # 年报/集团报表常没有「项目/本期金额/上期金额」表头，也没有框线：
        # 左侧项目列无表头，右侧直接写「附注 2024 年度 2023 年度」。这种版式
        # 表格识别拿不到表头锚点，退化为逐行读：年份表头确定两条金额列的右边界，
        # 行首已知行名定位项目，只接受右边界对齐的金额块。仅用于文本层页面，
        # 扫描件仍走 OCR + 表格，避免把 OCR 合并框当成单元格。
        line_fallback:
          enabled: true
          engines: [pymupdf_text]
          header_pattern: '^20\d{2}\s*(?:年度|年)?$'
          header_merge: [年度, 年]
          header_merge_gap: 12
          columns: [本期金额, 上期金额]
          column_tolerance: 20
          # 行回落只证明「行名 + 金额列对齐」，没有表头覆盖和框线证据。
          # 给一半结构分：不触发 TEMPLATE_MISMATCH 永久拒收，校准也能看到
          # 它比真正的表格行弱，但不会假装两者等价。
          structural_score: 0.6
          label_prefixes: [一、, 二、, 三、, 四、, 五、, 六、, 七、, 八、, 九、, 十、,
                           减：, 加：, 其中：]
          label_aliases:
            公允价值变动收益: [公允价值变动损益]
          stop_labels: [后附的财务报表附注, 此财务报表已于, 法定代表人, 公司负责人]
    fields:
      - {path: is.company_name, label: 编制单位, aliases: [企业名称], type: string, required: true, risk: party_name, extractor: label_value, rules: [NON_EMPTY]}
      - {path: is.statement_period_start, label: 报表期间（起）, aliases: [期间], type: date, required: true, risk: date, extractor: period_range, part: start, rules: [DATE]}
      - {path: is.statement_period_end, label: 报表期间（止）, aliases: [期间], type: date, required: true, risk: date, extractor: period_range, part: end, rules: [DATE]}
      - {path: is.currency_unit, label: 单位, type: enum, enum: unit, required: true, risk: enum_flag, extractor: unit, rules: [UNIT]}
      - {path: is.revenue, label: 营业收入, type: decimal, required: true, risk: monetary, extractor: table_row, table: income, row_label: 营业收入, column: 本期金额, rules: [MONEY, NON_NEGATIVE]}
      - {path: is.cost_of_sales, label: 营业成本, type: decimal, required: true, risk: monetary, extractor: table_row, table: income, row_label: 营业成本, column: 本期金额, rules: [MONEY, NON_NEGATIVE]}
      - {path: is.taxes_surcharges, label: 税金及附加, type: decimal, required: true, risk: monetary, extractor: table_row, table: income, row_label: 税金及附加, column: 本期金额, rules: [MONEY, NON_NEGATIVE]}
      - {path: is.selling_expenses, label: 销售费用, type: decimal, required: true, risk: monetary, extractor: table_row, table: income, row_label: 销售费用, column: 本期金额, rules: [MONEY, NON_NEGATIVE]}
      - {path: is.admin_expenses, label: 管理费用, type: decimal, required: true, risk: monetary, extractor: table_row, table: income, row_label: 管理费用, column: 本期金额, rules: [MONEY, NON_NEGATIVE]}
      - {path: is.rd_expenses, label: 研发费用, type: decimal, required: false, risk: monetary, extractor: table_row, table: income, row_label: 研发费用, column: 本期金额, rules: [MONEY_OPT, NON_NEGATIVE]}
      - {path: is.finance_expenses, label: 财务费用, type: decimal, required: true, risk: monetary, extractor: table_row, table: income, row_label: 财务费用, column: 本期金额, rules: [MONEY]}
      - {path: is.other_income, label: 其他收益, type: decimal, required: false, risk: monetary, extractor: table_row, table: income, row_label: 其他收益, column: 本期金额, rules: [MONEY_OPT]}
      - {path: is.investment_income, label: 投资收益, type: decimal, required: false, risk: monetary, extractor: table_row, table: income, row_label: 投资收益, column: 本期金额, rules: [MONEY_OPT]}
      # 信用/资产减值损失与资产处置、公允价值变动收益是信贷审查判断「利润里有多少
      # 不是主营赚来的」的关键行；老准则模板没有前两行时留空，不阻断其余行。
      - {path: is.credit_impairment_loss, label: 信用减值损失, type: decimal, required: false, risk: monetary, extractor: table_row, table: income, row_label: 信用减值损失, column: 本期金额, rules: [MONEY_OPT]}
      - {path: is.asset_impairment_loss, label: 资产减值损失, type: decimal, required: false, risk: monetary, extractor: table_row, table: income, row_label: 资产减值损失, column: 本期金额, rules: [MONEY_OPT]}
      - {path: is.asset_disposal_gain, label: 资产处置收益, type: decimal, required: false, risk: monetary, extractor: table_row, table: income, row_label: 资产处置收益, column: 本期金额, rules: [MONEY_OPT]}
      - {path: is.fair_value_change_gain, label: 公允价值变动收益, type: decimal, required: false, risk: monetary, extractor: table_row, table: income, row_label: 公允价值变动收益, column: 本期金额, rules: [MONEY_OPT]}
      - {path: is.operating_profit, label: 营业利润, type: decimal, required: true, risk: monetary, extractor: table_row, table: income, row_label: 营业利润, column: 本期金额, rules: [MONEY]}
      - {path: is.non_operating_income, label: 营业外收入, type: decimal, required: true, risk: monetary, extractor: table_row, table: income, row_label: 营业外收入, column: 本期金额, rules: [MONEY, NON_NEGATIVE]}
      - {path: is.non_operating_expense, label: 营业外支出, type: decimal, required: true, risk: monetary, extractor: table_row, table: income, row_label: 营业外支出, column: 本期金额, rules: [MONEY, NON_NEGATIVE]}
      - {path: is.total_profit, label: 利润总额, type: decimal, required: true, risk: monetary, extractor: table_row, table: income, row_label: 利润总额, column: 本期金额, rules: [MONEY]}
      - {path: is.income_tax, label: 所得税费用, type: decimal, required: true, risk: monetary, extractor: table_row, table: income, row_label: 所得税费用, column: 本期金额, rules: [MONEY, NON_NEGATIVE]}
      - {path: is.net_profit, label: 净利润, type: decimal, required: true, risk: monetary, extractor: table_row, table: income, row_label: 净利润, column: 本期金额, rules: [MONEY]}
      # 新准则模板在净利润之后列「其他综合收益的税后净额」与「综合收益总额」；
      # 综合收益总额是信贷审查里判断净利润有没有被其他综合收益放大的落点。
      - {path: is.total_comprehensive_income, label: 综合收益总额, type: decimal, required: false, risk: monetary, extractor: table_row, table: income, row_label: 综合收益总额, column: 本期金额, rules: [MONEY_OPT]}
      - {path: is.prior_revenue, label: 营业收入, type: decimal, required: false, risk: monetary, extractor: table_row, table: income, row_label: 营业收入, column: 上期金额, rules: [MONEY_OPT, NON_NEGATIVE]}
      - {path: is.prior_net_profit, label: 净利润, type: decimal, required: false, risk: monetary, extractor: table_row, table: income, row_label: 净利润, column: 上期金额, rules: [MONEY_OPT]}

  CREDIT_REPORT_ENTERPRISE:
    label: 企业征信报告
    keywords:
      信用报告: 4
      征信: 3
      报告编号: 3
      未结清贷款: 3
      逾期: 2
    tables: {}
    fields:
      - {path: cr.company_name, label: 企业名称, type: string, required: true, risk: party_name, extractor: label_value, rules: [NON_EMPTY]}
      - {path: cr.unified_social_credit_code, label: 统一社会信用代码, type: string, required: true, risk: identity, extractor: regex, pattern: '[0-9A-HJ-NP-RTUW-Y]{18}', rules: [USCC]}
      - {path: cr.report_number, label: 报告编号, type: string, required: true, risk: identity, extractor: regex, pattern: '[A-Z0-9]{8,32}', rules: [REPORT_NO]}
      - {path: cr.query_date, label: 查询日期, aliases: [报告时间], type: date, required: true, risk: date, extractor: label_value, rules: [DATE]}
      - {path: cr.report_period_start, label: 报告期间, type: date, required: false, risk: date, extractor: period_range, part: start, rules: [DATE_OPT]}
      - path: cr.loan_account_count
        label: 未结清贷款笔数
        type: integer
        required: true
        risk: count
        extractor: label_value
        rules: [COUNT]
        # 征信中心展示样式的「未结清信贷及授信信息概要」按正常类/关注类/不良类/合计
        # 分 4 组，每组重复「账户数 / 余额」，没有逐格框线。只有子表头序列、合计行
        # 与数值格数量三者完全对齐时才取；对不上就留空进复核。
        fallback:
          extractor: header_matrix
          section: 未结清信贷及授信信息概要
          header_sequence: [正常类, 关注类, 不良类, 合计]
          column_labels: [账户数, 余额]
          row_label: 合计
          value_index: 6
          max_header_lines: 3
          max_row_gap: 8
      - path: cr.outstanding_loan_balance
        label: 未结清贷款余额
        type: decimal
        required: true
        risk: monetary
        extractor: label_value
        rules: [MONEY]
        fallback:
          extractor: header_matrix
          section: 未结清信贷及授信信息概要
          header_sequence: [正常类, 关注类, 不良类, 合计]
          column_labels: [账户数, 余额]
          row_label: 合计
          value_index: 7
          max_header_lines: 3
          max_row_gap: 8
          # 征信报告的金额单位写在「报告说明」里（单位均为万元），不在表格内；
          # 找不到这条口径就无法折算，宁可标 AMBIGUOUS_UNIT 进复核。
          unit_from_document: true
      - {path: cr.overdue_account_count_24m, label: 近24个月逾期账户数, aliases: [近 24 个月逾期账户数], type: integer, required: true, risk: count, extractor: label_value, rules: [COUNT]}
      - {path: cr.max_overdue_months, label: 最长逾期月数, type: integer, required: true, risk: count, extractor: label_value, rules: [COUNT]}
      - {path: cr.query_count_3m, label: 近3个月查询次数, aliases: [近 3 个月查询次数], type: integer, required: true, risk: count, extractor: label_value, rules: [COUNT]}
      - {path: cr.bad_debt_flag, label: 呆账标志, type: enum, enum: flag, required: true, risk: enum_flag, extractor: label_value, rules: [FLAG]}
      - {path: cr.asset_disposal_flag, label: 资产处置标志, type: enum, enum: flag, required: false, risk: enum_flag, extractor: label_value, rules: [FLAG_OPT]}
      - {path: cr.guarantee_flag, label: 对外担保标志, type: enum, enum: flag, required: false, risk: enum_flag, extractor: label_value, rules: [FLAG_OPT]}
      - {path: cr.public_record_count, label: 公共记录条数, type: integer, required: false, risk: count, extractor: label_value, rules: [COUNT_OPT]}
      - {path: cr.credit_rating, label: 信用等级, type: enum, enum: rating, required: false, risk: optional_low_risk, extractor: label_value, rules: [RATING_OPT]}

  VAT_INVOICE:
    label: 增值税发票
    keywords:
      增值税专用发票: 4
      电子发票: 3
      发票号码: 3
      价税合计: 3
      购买方: 2
      销售方: 2
      开票日期: 2
      纳税人识别号: 2
    # 数电发票二维码载荷：01,31,,发票号码,价税合计,开票日期,,校验码
    # 只用于补空与核对；与 OCR 冲突时进复核，不覆盖 OCR 结果。
    qr:
      fields:
        invoice_number: {index: 3}
        total_with_tax: {index: 4}
        invoice_date: {index: 5}
    tables:
      line_items:
        headers: [项目名称, 规格型号, 单位, 数量, 单价, 金额, 税率/征收率, 税额]
        aliases:
          项目名称: [货物或应税劳务名称]
          税率/征收率: [税率, 征收率]
        min_columns: 5
        # 首行行名与水印/表头在 OCR 框上常有几像素重叠，判数据行时放宽。
        header_row_slack: 6
        # 合计行没有数量和税额列之外的完整结构，交给标量字段单独抽取。
        row_required: [项目名称, 数量, 金额]
        stop_labels: [合计, 价税合计, 合同编号, 备注]
    fields:
      - {path: vi.invoice_number, label: 发票号码, type: string, required: true, risk: identity, extractor: regex, pattern: '发票号码[:：]?([0-9]{8,32})', group: 1, rules: [INVOICE_NO], qr_field: invoice_number}
      - {path: vi.invoice_date, label: 开票日期, type: date, required: true, risk: date, extractor: label_value, rules: [DATE], qr_field: invoice_date}
      - {path: vi.buyer_name, label: 名称, type: string, required: true, risk: party_name, extractor: label_region, occurrence: 1, rules: [NON_EMPTY]}
      - {path: vi.buyer_tax_id, label: 统一社会信用代码/纳税人识别号, aliases: [纳税人识别号], type: string, required: true, risk: identity, extractor: label_region, occurrence: 1, rules: [TAX_ID]}
      - {path: vi.seller_name, label: 名称, type: string, required: true, risk: party_name, extractor: label_region, occurrence: 2, rules: [NON_EMPTY]}
      - {path: vi.seller_tax_id, label: 统一社会信用代码/纳税人识别号, aliases: [纳税人识别号], type: string, required: true, risk: identity, extractor: label_region, occurrence: 2, rules: [TAX_ID]}
      - {path: vi.total_amount, label: 合计, type: decimal, required: true, risk: monetary, extractor: label_region, value_index: 0, rules: [MONEY]}
      - {path: vi.total_tax, label: 合计, type: decimal, required: true, risk: monetary, extractor: label_region, value_index: 1, rules: [MONEY]}
      - {path: vi.total_with_tax, label: 价税合计, type: decimal, required: true, risk: monetary, extractor: regex, pattern: '[（(]小写[)）][￥¥Y]?([\d,]+\.\d{2})', group: 1, allow_unlabeled: true, rules: [MONEY], qr_field: total_with_tax}
      - {path: vi.contract_number, label: 合同编号, type: string, required: false, risk: optional_low_risk, extractor: label_value, rules: []}
      - {path: vi.issuer, label: 开票人, type: string, required: false, risk: optional_low_risk, extractor: label_value, rules: []}
      - {path: "vi.items[i].name", label: 项目名称, type: string, required: true, risk: free_text, extractor: table_cell, table: line_items, column: 项目名称, array: vi.items, rules: [NON_EMPTY]}
      - {path: "vi.items[i].spec_model", label: 规格型号, type: string, required: false, risk: optional_low_risk, extractor: table_cell, table: line_items, column: 规格型号, array: vi.items, rules: []}
      - {path: "vi.items[i].unit", label: 单位, type: string, required: false, risk: optional_low_risk, extractor: table_cell, table: line_items, column: 单位, array: vi.items, rules: []}
      - {path: "vi.items[i].quantity", label: 数量, type: decimal, required: true, risk: count, extractor: table_cell, table: line_items, column: 数量, array: vi.items, rules: [POSITIVE]}
      - {path: "vi.items[i].unit_price", label: 单价, type: decimal, required: true, risk: monetary, extractor: table_cell, table: line_items, column: 单价, array: vi.items, rules: [MONEY]}
      - {path: "vi.items[i].amount", label: 金额, type: decimal, required: true, risk: monetary, extractor: table_cell, table: line_items, column: 金额, array: vi.items, rules: [MONEY]}
      - {path: "vi.items[i].tax_rate", label: 税率/征收率, type: string, required: true, risk: enum_flag, extractor: table_cell, table: line_items, column: 税率/征收率, array: vi.items, rules: []}
      - {path: "vi.items[i].tax_amount", label: 税额, type: decimal, required: true, risk: monetary, extractor: table_cell, table: line_items, column: 税额, array: vi.items, rules: [MONEY]}

  CUSTOMS_VAT_PAYMENT:
